name: Main

on:
    push:
    # Allows starting the workflow by hand: Actions tab → Main → Run workflow
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pages: write

jobs:
    build:
        name: Build library
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint library
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Install browser for tests
              run: pnpm exec playwright install --with-deps --only-shell chromium

            - name: Test
              run: pnpm test
              env:
                  FC_NUM_RUNS: 1000

            - name: Build library
              run: pnpm build:lib

            - name: Upload build files
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: dist

    deploy:
        name: Deploy demo page
        needs: build
        runs-on: ubuntu-24.04
        if: github.ref == 'refs/heads/main'
        # Required by deploy-pages
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build demo
              run: pnpm build:demo

            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  name: github-pages
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5


    publish:
        name: Publish package
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Download build files
              uses: actions/download-artifact@v8
              with:
                  name: build
                  path: dist

            # Prereleases (e.g. v1.0.0-beta.0) go to the "next" tag, so `npm install` keeps installing the latest stable version
            - name: Publish
              run: npm publish --access public $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--tag next")
